<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | عيادة نيو دنت</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #0284c7;
            --primary-dark: #0369a1;
            --secondary-color: #0f172a;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --text-color: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border-radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* Side Navigation Bar */
        .sidebar {
            width: 250px;
            background: var(--secondary-color);
            color: var(--white);
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .sidebar .brand {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sidebar-menu a {
            color: #94a3b8;
            text-decoration: none;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }

        .sidebar-menu a.active, .sidebar-menu a:hover {
            background: var(--primary-color);
            color: var(--white);
        }

        /* Main Content Layout */
        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .header-title {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* KPI Stat Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--white);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-card .info h3 {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 0.3rem;
        }

        .stat-card .info p {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--secondary-color);
        }

        .stat-card .icon {
            font-size: 2rem;
            padding: 1rem;
            border-radius: 50%;
            background: #e0f2fe;
            color: var(--primary-color);
        }

        /* Data Tables Container */
        .table-container {
            background: var(--white);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 700;
        }

        /* Status Badge */
        .badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-pending { background: #fef3c7; color: #b45309; }
        .badge-confirmed { background: #d1fae5; color: #047857; }
        .badge-cancelled { background: #fee2e2; color: #b91c1c; }

        /* Action Buttons */
        .btn-action {
            border: none;
            background: none;
            font-size: 1.1rem;
            cursor: pointer;
            margin-left: 0.5rem;
            transition: color 0.2s;
        }

        .btn-approve { color: var(--success); }
        .btn-cancel { color: var(--warning); }
        .btn-delete { color: var(--danger); }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; }
            .table-container { overflow-x: auto; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-tooth"></i>
            <span>إدارة نيو دنت</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#" class="active"><i class="fa-solid fa-calendar-check"></i> المواعيد</a></li>
            <li><a href="#"><i class="fa-solid fa-user-doctor"></i> الأطباء</a></li>
            <li><a href="#"><i class="fa-solid fa-users"></i> المرضى</a></li>
            <li><a href="#"><i class="fa-solid fa-chart-line"></i> التقارير</a></li>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="header-title">
            <h2>إدارة طلبات المواعيد</h2>
            <button class="btn-primary" onclick="seedSampleData()">إضافة بيانات تجريبية</button>
        </div>

        <!-- STATS CARDS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="info">
                    <h3>إجمالي الطلبات</h3>
                    <p id="totalCount">0</p>
                </div>
                <div class="icon"><i class="fa-solid fa-clipboard-list"></i></div>
            </div>
            <div class="stat-card">
                <div class="info">
                    <h3>معلقة (انتظار)</h3>
                    <p id="pendingCount">0</p>
                </div>
                <div class="icon" style="background: #fef3c7; color: var(--warning);"><i class="fa-solid fa-clock"></i></div>
            </div>
            <div class="stat-card">
                <div class="info">
                    <h3>مواعيد مؤكدة</h3>
                    <p id="confirmedCount">0</p>
                </div>
                <div class="icon" style="background: #d1fae5; color: var(--success);"><i class="fa-solid fa-circle-check"></i></div>
            </div>
        </div>

        <!-- APPOINTMENTS TABLE -->
        <div class="table-container">
            <div class="table-header">
                <h3>قائمة المواعيد الواردة</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>المريض</th>
                        <th>رقم الهاتف</th>
                        <th>الخدمة</th>
                        <th>التاريخ</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="appointmentsTable">
                    <!-- Data populated via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- JAVASCRIPT SYSTEM LOGIC -->
<!-- استبدال وسم <script> الحالي في admin.html بهذا الكود -->
<script type="module">
    // 1. استيراد مكتبات Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 2. بيانات مشروعك في Firebase (استبدلها ببياناتك الحقيقية)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "your-project-id.firebaseapp.com",
        databaseURL: "https://your-project-id-default-rtdb.firebaseio.com",
        projectId: "your-project-id",
        storageBucket: "your-project-id.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // 3. تهيئة التطبيق وقاعدة البيانات
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const appointmentsRef = ref(db, 'appointments');

    // 4. الاستماع والتحديث اللحظي للبيانات (Realtime Listener)
    onValue(appointmentsRef, (snapshot) => {
        const data = snapshot.val();
        const tableBody = document.getElementById('appointmentsTable');
        tableBody.innerHTML = '';

        let total = 0, pending = 0, confirmed = 0;

        if (!data) {
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #94a3b8;">لا توجد طلبات مواعيد حالياً.</td></tr>`;
        } else {
            // تحويل كائن Firebase إلى مصفوفة مع الحفاظ على المعرف الفريد (key)
            Object.keys(data).forEach((key) => {
                const item = data[key];
                total++;

                if (item.status === 'قيد الانتظار') pending++;
                if (item.status === 'مؤكد') confirmed++;

                const statusClass = item.status === 'مؤكد' ? 'badge-confirmed' : 
                                  (item.status === 'ملغى' ? 'badge-cancelled' : 'badge-pending');

                const row = `
                    <tr>
                        <td><strong>${item.name}</strong></td>
                        <td>${item.phone}</td>
                        <td>${item.service}</td>
                        <td>${item.date}</td>
                        <td><span class="badge ${statusClass}">${item.status}</span></td>
                        <td>
                            <button class="btn-action btn-approve" title="تأكيد الموعد" onclick="updateStatus('${key}', 'مؤكد')"><i class="fa-solid fa-check-circle"></i></button>
                            <button class="btn-action btn-cancel" title="إلغاء الموعد" onclick="updateStatus('${key}', 'ملغى')"><i class="fa-solid fa-ban"></i></button>
                            <button class="btn-action btn-delete" title="حذف" onclick="deleteAppointment('${key}')"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        // تحديث الإحصائيات
        document.getElementById('totalCount').innerText = total;
        document.getElementById('pendingCount').innerText = pending;
        document.getElementById('confirmedCount').innerText = confirmed;
    });

    // 5. تعديل حالة الموعد في Firebase
    window.updateStatus = async function(id, newStatus) {
        const itemRef = ref(db, `appointments/${id}`);
        await update(itemRef, { status: newStatus });
    };

    // 6. حذف موعد من Firebase
    window.deleteAppointment = async function(id) {
        if (confirm('هل أنت تأكد من حذف هذا الموعد؟')) {
            const itemRef = ref(db, `appointments/${id}`);
            await remove(itemRef);
        }
    };
</script>
</body>
</html>
